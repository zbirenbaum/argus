[package]
name = "argus"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
sha2.workspace = true
nix.workspace = true
uuid.workspace = true
chrono.workspace = true
rcgen = "0.13"
time = "0.3"
aws-sdk-s3 = { version = "1", default-features = false }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "credentials-process", "sso"] }
aws-smithy-runtime = { version = "1", default-features = false }
aws-smithy-http-client = { version = "1", features = ["default-client", "rustls-ring"] }
rustls.workspace = true
serde_yaml = "0.9"
glob = "0.3"
humantime-serde = "1"
bytesize = { version = "2", features = ["serde"] }
bincode = "1"
fastrand = "2"
bytes = "1"
# Used in cas/store.rs for atomic writes (not just tests).
tempfile = "3"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
