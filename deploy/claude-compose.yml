# Run Claude Code inside Argus with MinIO for event/snapshot storage.
#
# Usage:
#   # 1. Build the supervisor base image first:
#   docker build -t argus-supervisor:latest -f deploy/Dockerfile .
#
#   # 2. Build the Claude Code layer:
#   docker build -t argus-claude:latest -f deploy/Dockerfile.claude deploy/
#
#   # 3. Copy auth state (one-time):
#   cp -r ~/.claude ./claude-auth
#
#   # 4. Run:
#   docker compose -f deploy/claude-compose.yml up

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/argus-events &&
      echo 'Bucket argus-events created'
      "

  argus-claude:
    image: argus-claude:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      # Claude Code auth — set your API key or mount ~/.claude
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./claude-auth:/home/agent/.claude
      - ${WORKSPACE:-./workspace}:/workspace
      - ./claude-supervisor.yaml:/etc/argus/supervisor.yaml:ro
      - argus-data:/data
    working_dir: /workspace
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    stdin_open: true
    tty: true
    ports:
      - "9090:9090"
    command: >
      claude --dangerously-skip-permissions -p
      "You are an autonomous agent running inside a sandboxed container.
      Your task: Build an autonomous agent runtime framework in /workspace.
      This should be a production-quality system that can orchestrate
      autonomous AI agents — task decomposition, tool use, memory,
      self-correction, and multi-step planning. Use whatever language
      and architecture you think is best. You will receive no further
      instructions. Work fully autonomously until the project is complete.
      Start by creating a design doc, then implement iteratively."

volumes:
  minio-data:
  argus-data:
