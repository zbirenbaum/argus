# Dev environment: build/test container + MinIO for S3 integration tests.
#
# The argus-arm64 image is the dev container (no supervisor entrypoint).
# Tests launch their own supervisor instances as needed.
#
# Usage:
#   docker compose up -d
#   docker exec -w /build argus-arm64 cargo test ...
#   docker exec -w /build argus-arm64 ./tests/validate.sh

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/argus-test &&
      echo 'Bucket argus-test created'
      "

  argus-dev:
    image: argus-arm64
    container_name: argus-arm64
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - .:/build
    working_dir: /build
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    # No supervisor here — this is a build/test environment.
    # Tests launch supervisor instances on demand.
    command: sleep infinity
